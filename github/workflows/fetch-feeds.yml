name: Fetch News Feeds

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: |
          mkdir -p /tmp/feeds && rm -f /tmp/feeds/*.json

          fetch_feed() {
            local SRC="$1" URL="$2" OUT="$3"
            echo "Fetching: $SRC"
            local XML
            XML=$(curl -sL --max-time 15 -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64)" -H "Accept: application/rss+xml" "$URL" 2>/dev/null)
            if [ -z "$XML" ] || ! echo "$XML" | grep -q "<rss\|<feed\|<item\|<entry"; then
              echo "  empty"
              echo "[]" > "$OUT"
              return
            fi
            echo "$XML" | python3 - "$SRC" "$OUT" << 'HEREDOC'
          import sys, xml.etree.ElementTree as ET, json, re, html
          src, out = sys.argv[1], sys.argv[2]
          items = []
          data = sys.stdin.read()
          try:
              root = ET.fromstring(data)
          except:
              open(out,'w').write('[]')
              sys.exit(0)
          for item in root.iter('item'):
              t = (item.findtext('title') or '').strip()
              l = (item.findtext('link') or '').strip()
              d = (item.findtext('pubDate') or '').strip()
              dr = (item.findtext('description') or '').strip()
              desc = html.unescape(re.sub(r'<[^>]*>','',dr)).strip()[:250]
              if t: items.append({'title':t,'link':l,'pubDate':d,'description':desc,'source':src})
          if not items:
              ns={'a':'http://www.w3.org/2005/Atom'}
              for e in root.findall('.//a:entry',ns):
                  t=(e.findtext('a:title',namespaces=ns) or '').strip()
                  le=e.find("a:link[@rel='alternate']",ns) or e.find('a:link',ns)
                  l=(le.get('href') or '').strip() if le is not None else ''
                  d=(e.findtext('a:published',namespaces=ns) or e.findtext('a:updated',namespaces=ns) or '').strip()
                  dr=(e.findtext('a:summary',namespaces=ns) or e.findtext('a:content',namespaces=ns) or '').strip()
                  desc=html.unescape(re.sub(r'<[^>]*>','',dr)).strip()[:250]
                  if t: items.append({'title':t,'link':l,'pubDate':d,'description':desc,'source':src})
          if src=='HKCERT':
              for it in items:
                  x=it.get('description','')
                  s='MEDIUM'
                  if re.search(r'critical|極高',x,re.I): s='CRITICAL'
                  elif re.search(r'high risk|高度',x,re.I): s='HIGH'
                  cves=re.findall(r'CVE-\d{4}-\d+',x)
                  it['severity']=s
                  it['cveIds']=', '.join(list(dict.fromkeys(cves)))
                  it['products']=it['title'].replace('Multiple Vulnerabilities','').strip()
          open(out,'w').write(json.dumps(items[:15]))
          HEREDOC
          }

          fetch_feed "iThome資安" "https://www.ithome.com.tw/rss/security" "/tmp/feeds/cn_sec_1.json"
          fetch_feed "iThome" "https://www.ithome.com.tw/rss/" "/tmp/feeds/cn_sec_2.json"
          fetch_feed "iThome" "https://www.ithome.com.tw/rss/" "/tmp/feeds/cn_tech_1.json"
          fetch_feed "INSIDE" "https://www.inside.com.tw/feed/" "/tmp/feeds/cn_tech_2.json"
          fetch_feed "TechOrange" "https://feeds.feedburner.com/techorange" "/tmp/feeds/cn_tech_3.json"
          fetch_feed "TheHackerNews" "https://feeds.feedburner.com/TheHackersNews" "/tmp/feeds/en_sec_1.json"
          fetch_feed "BleepingComputer" "https://www.bleepingcomputer.com/feed/" "/tmp/feeds/en_sec_2.json"
          fetch_feed "TechCrunch" "https://techcrunch.com/feed/" "/tmp/feeds/en_tech_1.json"
          fetch_feed "TheVerge" "https://www.theverge.com/rss/index.xml" "/tmp/feeds/en_tech_2.json"
          fetch_feed "HKCERT" "https://www.hkcert.org/getrss/security-bulletin" "/tmp/feeds/cve_1.json"
          echo "Done fetching"

      - name: Merge
        run: |
          python3 << 'EOF'
          import json, glob
          from datetime import datetime, timezone
          tabs={'cn_sec':[],'cn_tech':[],'en_sec':[],'en_tech':[],'cve':[]}
          for f in glob.glob('/tmp/feeds/*.json'):
              tab=f.split('/')[-1].rsplit('_',1)[0]
              try:
                  items=json.load(open(f))
                  if isinstance(items,list): tabs[tab].extend(items)
              except: pass
          for tab in tabs:
              seen=set(); unique=[]
              for it in sorted(tabs[tab],key=lambda x:x.get('pubDate',''),reverse=True):
                  k=(it.get('title','') or '').strip().lower()
                  if not k or k in seen: continue
                  seen.add(k); unique.append(it)
              tabs[tab]=unique[:20]
          cn=set(it.get('title','').strip().lower() for it in tabs['cn_sec'])
          tabs['cn_tech']=[it for it in tabs['cn_tech'] if it.get('title','').strip().lower() not in cn]
          data={'ts':datetime.now(timezone.utc).isoformat(),'tabs':tabs}
          json.dump(data,open('data.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(f"Total: {sum(len(v) for v in tabs.values())} items")
          EOF

      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feeds $(date -u +%H:%M)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          fi
