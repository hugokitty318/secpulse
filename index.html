<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecPulse — QA Security News</title>
<style>
:root {
  --bg: #0f1117;
  --bg2: #161922;
  --bg3: #1c1f2b;
  --border: #2a2d3a;
  --text: #e4e6ed;
  --text2: #8b8fa3;
  --text3: #5c5f72;
  --accent: #4f8cff;
  --accent2: #3a6fd8;
  --red: #ef4444;
  --orange: #f59e0b;
  --yellow: #eab308;
  --green: #22c55e;
  --radius: 8px;
}
[data-theme="light"] {
  --bg: #fafafa;
  --bg2: #ffffff;
  --bg3: #f3f4f6;
  --border: #e2e4e9;
  --text: #1a1c23;
  --text2: #5c5f72;
  --text3: #9ca0b0;
  --accent: #3b6fd4;
  --accent2: #2d5ab8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  height: 52px;
}
.logo {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  white-space: nowrap;
}
.logo span { color: var(--accent); }
.tabs {
  display: flex;
  gap: 2px;
  margin-left: 12px;
  flex: 1;
}
.tab {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-wrap {
  position: relative;
}
.search-input {
  width: 180px;
  padding: 6px 10px 6px 28px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
  outline: none;
  transition: border-color .15s, width .2s;
}
.search-input:focus { border-color: var(--accent); width: 220px; }
.search-icon {
  position: absolute;
  left: 8px; top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--text3);
}
.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--text); border-color: var(--text3); }
.icon-btn.spinning { animation: spin .6s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Main */
.main {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* Highlights */
.highlights {
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  max-height: 140px;
  overflow: hidden;
  flex-shrink: 0;
}
.hl-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text3);
  margin-bottom: 8px;
}
.hl-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hl-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  padding: 4px 10px;
  background: var(--bg2);
  border-radius: 6px;
  border: 1px solid var(--border);
  transition: border-color .15s;
}
.hl-item:hover { border-color: var(--text3); }
.hl-item a { color: var(--text); text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hl-item a:hover { color: var(--accent); }
.hl-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.hl-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.badge-critical { background: rgba(239,68,68,.15); color: var(--red); }
.badge-high { background: rgba(245,158,11,.15); color: var(--orange); }
.badge-medium { background: rgba(234,179,8,.15); color: var(--yellow); }
.badge-low { background: rgba(34,197,94,.15); color: var(--green); }
.badge-info { background: rgba(79,140,255,.15); color: var(--accent); }

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
  scroll-behavior: smooth;
}
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Cards grid */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.news-card {
  padding: 12px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: default;
  transition: border-color .15s;
}
.news-card:hover { border-color: var(--text3); }
.news-card.expanded { grid-column: 1 / -1; }
.nc-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.nc-source {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .3px;
}
.nc-time {
  font-size: 11px;
  color: var(--text3);
  margin-left: auto;
}
.nc-title {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.news-card.expanded .nc-title {
  -webkit-line-clamp: unset;
  display: block;
}
.nc-title a { color: var(--text); text-decoration: none; }
.nc-title a:hover { color: var(--accent); }
.nc-desc {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
  display: none;
}
.news-card.expanded .nc-desc { display: block; }
.cvss-score {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
}
.cvss-critical { background: rgba(239,68,68,.15); color: var(--red); }
.cvss-high { background: rgba(245,158,11,.15); color: var(--orange); }
.cvss-medium { background: rgba(234,179,8,.15); color: var(--yellow); }
.cvss-low { background: rgba(34,197,94,.15); color: var(--green); }
.cve-id { font-weight: 600; font-size: 12px; }
.nc-products {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text2);
}
.news-card:has(.cvss-score) .nc-products { display: block; }
.news-card.expanded .nc-products { display: block; }

/* Expand btn */
.expand-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  margin-top: 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.expand-btn:hover { color: var(--text); border-color: var(--text3); }

/* Loading / Empty */
.loading, .empty-state {
  padding: 40px;
  text-align: center;
  color: var(--text3);
  font-size: 13px;
}
.skeleton {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.skel-card {
  height: 60px;
  background: var(--bg3);
  border-radius: var(--radius);
  animation: pulse 1.2s infinite;
}
@keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: .8; } }

/* Status bar */
.status-bar {
  padding: 6px 24px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text3);
  display: flex;
  justify-content: space-between;
  height: 28px;
  align-items: center;
}
</style>
</head>
<body data-theme="dark">

<div class="header">
  <div class="logo">Sec<span>Pulse</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="header-actions">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="searchInput" type="text" placeholder="">
    </div>
    <button class="icon-btn" id="themeBtn" title="">☽</button>
    <button class="icon-btn" id="langBtn" title="">EN</button>
    <button class="icon-btn" id="refreshBtn" title="">⟳</button>
  </div>
</div>

<div class="main">
  <div class="highlights" id="highlights">
    <div class="hl-label" id="hlLabel"></div>
    <div class="hl-list" id="hlList"></div>
  </div>
  <div class="content" id="content">
    <div class="loading"><div class="skeleton"><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div></div></div>
  </div>
  <div class="status-bar">
    <span id="statusLeft"></span>
    <span id="statusRight"></span>
  </div>
</div>

<script>
// ===== i18n =====
const I18N = {
  zh: {
    search: '搜尋標題...',
    todayHighlights: '今日重點',
    loading: '載入中...',
    loadMore: '查看更多 ↓',
    showLess: '收起 ↑',
    items: '條',
    lastUpdated: '更新於',
    refresh: '刷新',
    theme: '切換主題',
    lang: 'EN',
    empty: '暫無資料',
    error: '載入失敗，請檢查網絡',
    tabs: ['資安動態','科技前沿','Security','Tech & AI','Product Advisories'],
  },
  en: {
    search: 'Search headlines...',
    todayHighlights: 'Today\'s Highlights',
    loading: 'Loading...',
    loadMore: 'Show more ↓',
    showLess: 'Show less ↑',
    items: 'items',
    lastUpdated: 'Updated',
    refresh: 'Refresh',
    theme: 'Toggle theme',
    lang: '繁',
    empty: 'No items',
    error: 'Failed to load, check network',
    tabs: ['Security CN','Tech CN','Security EN','Tech & AI','Product Advisories'],
  }
};

// ===== State =====
let lang = 'zh';
let currentTab = 0;
let searchQuery = '';
let allData = {}; // { tabKey: [items] }
let expanded = false;

// ===== Feeds =====
const FEEDS = {
  cn_sec: [
    { source: 'iThome 資安', url: 'https://www.ithome.com.tw/rss/security' },
    { source: 'iThome', url: 'https://www.ithome.com.tw/rss/' },
  ],
  cn_tech: [
    { source: 'iThome', url: 'https://www.ithome.com.tw/rss/' },
    { source: 'INSIDE', url: 'https://www.inside.com.tw/feed/' },
    { source: 'TechOrange', url: 'https://feeds.feedburner.com/techorange' },
  ],
  en_sec: [
    { source: 'The Hacker News', url: 'https://feeds.feedburner.com/TheHackersNews' },
    { source: 'BleepingComputer', url: 'https://www.bleepingcomputer.com/feed/' },
  ],
  en_tech: [
    { source: 'TechCrunch', url: 'https://techcrunch.com/feed/' },
    { source: 'The Verge', url: 'https://www.theverge.com/rss/index.xml' },
  ],
};
const TAB_KEYS = ['cn_sec', 'cn_tech', 'en_sec', 'en_tech', 'cve'];
const CACHE_TTL = 10 * 60 * 1000;

// ===== Utils =====
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = Date.now() - d.getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}
function cacheKey(k) { return 'secpulse_' + k + '_' + (k === 'cve' ? 'cve' : k); }
function getCache(k) {
  try {
    const raw = localStorage.getItem(cacheKey(k));
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.ts < CACHE_TTL) return obj.items;
  } catch(e) {}
  return null;
}
function setCache(k, items) {
  try { localStorage.setItem(cacheKey(k), JSON.stringify({ ts: Date.now(), items })); } catch(e) {}
}
function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}

// ===== Fetch =====
async function fetchFeedDirect(url) {
  const r = await withTimeout(fetch(url, {
    cache: 'no-store',
    headers: { Accept: 'application/rss+xml, application/xml, text/xml, application/atom+xml, */*' }
  }), 7000);
  if (!r.ok) throw new Error('http ' + r.status);
  return await r.text();
}
async function fetchFeedProxy(url) {
  const r = await withTimeout(fetch('https://r.jina.ai/' + url), 9000);
  if (!r.ok) throw new Error('proxy ' + r.status);
  const text = await r.text();
  return text.replace(/^[\s\S]*?(<\?xml|<rss|<feed)/i, '$1');
}
async function fetchFeed(url) {
  try { return await fetchFeedDirect(url); } catch(e) {}
  try { return await fetchFeedProxy(url); } catch(e) {}
  throw new Error('all failed: ' + url);
}

function parseRssXml(xmlText, source) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (doc.querySelector('parsererror')) return [];
  const items = [];
  const clean = v => String(v || '').replace(/<[^>]*>/g, '').trim();
  doc.querySelectorAll('item').forEach(node => {
    const title = clean(node.querySelector('title')?.textContent);
    const link = clean(node.querySelector('link')?.textContent) || clean(node.querySelector('guid')?.textContent);
    const pubDate = clean(node.querySelector('pubDate')?.textContent || node.querySelector('dc\\:date')?.textContent);
    const desc = clean(node.querySelector('description')?.textContent);
    if (title) items.push({ title, link, pubDate, description: desc, source });
  });
  if (items.length === 0) {
    doc.querySelectorAll('entry').forEach(node => {
      const title = clean(node.querySelector('title')?.textContent);
      const linkEl = node.querySelector('link[rel="alternate"]') || node.querySelector('link[href]');
      const link = linkEl?.getAttribute('href') || clean(linkEl?.textContent);
      const pubDate = clean(node.querySelector('published')?.textContent || node.querySelector('updated')?.textContent);
      const desc = clean(node.querySelector('summary')?.textContent || node.querySelector('content')?.textContent);
      if (title) items.push({ title, link, pubDate, description: desc, source });
    });
  }
  return items.slice(0, 12);
}

// ===== CVE =====
async function fetchCVEs() {
  const cached = getCache('cve');
  if (cached) return cached;
  const now = new Date();
  const start = new Date(now.getTime() - 24 * 3600 * 1000);
  const fmt = d => d.toISOString().replace(/\.\d+Z$/, 'Z');
  const url = `https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=70&pubStartDate=${encodeURIComponent(fmt(start))}&pubEndDate=${encodeURIComponent(fmt(now))}`;
  const r = await withTimeout(fetch(url), 12000);
  if (!r.ok) throw new Error('nvd ' + r.status);
  const json = await r.json();
  // Group by product/vendor
  const groups = {};
  (json.vulnerabilities || []).forEach(v => {
    const cve = v.cve;
    const metrics = cve.metrics?.cvssMetricV31 || cve.metrics?.cvssMetricV40 || cve.metrics?.cvssMetricV30;
    const cvss = metrics?.[0]?.cvssData;
    const score = cvss?.baseScore || 0;
    const severity = cvss?.baseSeverity || (score >= 9 ? 'CRITICAL' : score >= 7 ? 'HIGH' : score >= 4 ? 'MEDIUM' : 'LOW');
    const desc = (cve.description?.[0]?.value || '').slice(0, 300);
    // extract product
    let product = 'Multiple Products';
    const configs = cve.configurations || [];
    const affectedSet = new Set();
    configs.forEach(c => (c.nodes || []).forEach(n => (n.cpeMatch || []).forEach(m => {
      if (m.vulnerable) {
        const parts = m.criteria.split(':');
        if (parts.length > 4) {
          const vendor = parts[3], prod = parts[4];
          if (vendor && prod && vendor !== 'c' && prod !== 'c') {
            affectedSet.add(vendor + ' ' + prod);
          }
        }
      }
    })));
    if (affectedSet.size === 1) product = [...affectedSet][0];
    else if (affectedSet.size > 1) product = [...affectedSet][0];
    if (!groups[product]) groups[product] = { product, cves: [], maxScore: 0, severity: 'LOW', date: cve.published, desc: '' };
    groups[product].cves.push(cve.id);
    if (score > groups[product].maxScore) {
      groups[product].maxScore = score;
      groups[product].severity = severity;
    }
    if (!groups[product].desc) groups[product].desc = desc;
    if (new Date(cve.published) > new Date(groups[product].date)) groups[product].date = cve.published;
  });
  const items = Object.values(groups).map(g => ({
    title: g.product + (g.cves.length > 1 ? `（${g.cves.length} 個漏洞）` : ''),
    link: 'https://nvd.nist.gov/vuln/detail/' + g.cves[0],
    pubDate: g.date,
    description: g.desc,
    source: 'NVD',
    cvss: g.maxScore,
    severity: g.severity,
    cveIds: g.cves.slice(0, 8).join(', '),
    products: g.product,
  }));
  items.sort((a, b) => (b.cvss || 0) - (a.cvss || 0));
  setCache('cve', items);
  return items;
}

// ===== Load =====
async function loadTab(key) {
  if (key === 'cve') {
    const data = await fetchCVEs();
    allData.cve = data;
    return;
  }
  const cached = getCache(key);
  if (cached) { allData[key] = cached; return; }
  const feeds = FEEDS[key] || [];
  const results = [];
  for (let i = 0; i < feeds.length; i += 2) {
    const batch = feeds.slice(i, i + 2);
    const settled = await Promise.allSettled(batch.map(f =>
      fetchFeed(f.url).then(xml => parseRssXml(xml, f.source))
    ));
    settled.forEach(s => { if (s.status === 'fulfilled') results.push(...s.value); });
  }
  // dedupe
  const seen = new Set();
  const all = results.filter(it => {
    const k = (it.title || '').trim().toLowerCase();
    if (!k || seen.has(k)) return false;
    seen.add(k); return true;
  });
  all.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
  setCache(key, all);
  allData[key] = all;
}

async function refreshAll() {
  document.getElementById('refreshBtn').classList.add('spinning');
  Object.keys(allData).forEach(k => delete allData[k]);
  // clear caches
  TAB_KEYS.forEach(k => { try { localStorage.removeItem(cacheKey(k)); } catch(e){} });
  await render();
  document.getElementById('refreshBtn').classList.remove('spinning');
}

// ===== Render =====
function render() {
  const key = TAB_KEYS[currentTab];
  renderTabs();
  renderHighlights();
  renderContent();
  renderStatus();
}

async function renderContent() {
  const key = TAB_KEYS[currentTab];
  const content = document.getElementById('content');
  // show skeleton if loading
  if (!allData[key]) {
    content.innerHTML = '<div class="loading"><div class="skeleton"><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div></div></div>';
    try {
      await loadTab(key);
    } catch(e) {
      content.innerHTML = `<div class="empty-state">${I18N[lang].error}</div>`;
      return;
    }
  }
  let items = allData[key] || [];
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    items = items.filter(it => (it.title || '').toLowerCase().includes(q));
  }
  if (items.length === 0) {
    content.innerHTML = `<div class="empty-state">${I18N[lang].empty}</div>`;
    return;
  }
  const showCount = expanded ? items.length : Math.min(8, items.length);
  const visible = items.slice(0, showCount);
  const isCve = key === 'cve';
  let html = '<div class="cards-grid">';
  visible.forEach(item => {
    const safeLink = /^https?:\/\//i.test(String(item.link || '').trim());
    if (isCve) {
      const cls = (item.severity || '').toLowerCase();
      const riskLabel = cls === 'critical' ? '極高風險' : cls === 'high' ? '高度風險' : cls === 'medium' ? '中度風險' : '低度風險';
      const riskLabelEn = cls === 'critical' ? 'Critical' : cls === 'high' ? 'High Risk' : cls === 'medium' ? 'Medium' : 'Low';
      const badgeCls = cls === 'critical' ? 'cvss-critical' : cls === 'high' ? 'cvss-high' : cls === 'medium' ? 'cvss-medium' : 'cvss-low';
      const dateStr = item.pubDate ? new Date(item.pubDate).toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric'}) : '';
      html += `<div class="news-card${expanded ? ' expanded' : ''}" data-link="${esc(item.link)}">
        <div class="nc-top">
          <span class="cvss-score ${badgeCls}">${riskLabel} ${riskLabelEn}</span>
          <span class="nc-time">${dateStr}</span>
        </div>
        <div class="nc-title"><a href="${safeLink ? esc(item.link) : '#'}" target="_blank" rel="noopener">${esc(item.title)}</a></div>
        <div class="nc-desc">${esc(item.description || '')}</div>
        <div class="nc-products">CVSS: ${item.cvss ? item.cvss.toFixed(1) : 'N/A'} | ${esc(item.cveIds || '')}</div>
      </div>`;
    } else {
      html += `<div class="news-card${expanded ? ' expanded' : ''}" data-link="${esc(item.link)}">
        <div class="nc-top">
          <span class="nc-source">${esc(item.source)}</span>
          <span class="nc-time">${timeAgo(item.pubDate)}</span>
        </div>
        <div class="nc-title"><a href="${safeLink ? esc(item.link) : '#'}" target="_blank" rel="noopener">${esc(item.title)}</a></div>
        <div class="nc-desc">${esc((item.description || '').slice(0, 200))}</div>
      </div>`;
    }
  });
  html += '</div>';
  if (items.length > 8) {
    html += `<div class="expand-btn" id="expandBtn">${expanded ? I18N[lang].showLess : I18N[lang].loadMore}</div>`;
  }
  content.innerHTML = html;
  const expandBtn = document.getElementById('expandBtn');
  if (expandBtn) {
    expandBtn.onclick = () => { expanded = !expanded; renderContent(); };
  }
}

function renderHighlights() {
  const hlList = document.getElementById('hlList');
  const hlLabel = document.getElementById('hlLabel');
  hlLabel.textContent = I18N[lang].todayHighlights;
  // Collect top items: CVE first (top 3), then other tabs (top 2)
  const items = [];
  const cveItems = allData.cve || [];
  cveItems.slice(0, 3).forEach(c => {
    const cls = (c.severity || '').toLowerCase();
    const dotColor = cls === 'critical' ? 'var(--red)' : cls === 'high' ? 'var(--orange)' : 'var(--yellow)';
    const badgeCls = cls === 'critical' ? 'badge-critical' : cls === 'high' ? 'badge-high' : 'badge-medium';
    const riskShort = cls === 'critical' ? '極高' : cls === 'high' ? 'High' : 'Med';
    items.push({
      dot: dotColor,
      badge: `<span class="hl-badge ${badgeCls}">${riskShort}</span>`,
      title: c.title,
      link: c.link
    });
  });
  // top from current tab
  const curItems = allData[TAB_KEYS[currentTab]] || [];
  curItems.slice(0, 2).forEach(it => {
    if (!items.find(x => x.title === it.title)) {
      items.push({ dot: 'var(--accent)', badge: '', title: it.title, link: it.link });
    }
  });
  // fill from other tabs if needed
  TAB_KEYS.forEach(k => {
    if (items.length >= 5) return;
    (allData[k] || []).slice(0, 2).forEach(it => {
      if (items.length < 5 && !items.find(x => x.title === it.title)) {
        items.push({ dot: 'var(--text3)', badge: '', title: it.title, link: it.link });
      }
    });
  });
  if (items.length === 0) {
    hlList.innerHTML = `<div style="font-size:12px;color:var(--text3);padding:8px">${I18N[lang].loading}</div>`;
    return;
  }
  hlList.innerHTML = items.slice(0, 5).map(it =>
    `<div class="hl-item">
      <span class="hl-dot" style="background:${it.dot}"></span>
      <a href="${/^https?:\/\//i.test(it.link||'') ? esc(it.link) : '#'}" target="_blank" rel="noopener">${esc(it.title)}</a>
      ${it.badge}
    </div>`
  ).join('');
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = I18N[lang].tabs.map((t, i) =>
    `<div class="tab${i === currentTab ? ' active' : ''}" data-i="${i}">${t}</div>`
  ).join('');
  tabs.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { currentTab = +el.dataset.i; expanded = false; render(); };
  });
}

function renderStatus() {
  const key = TAB_KEYS[currentTab];
  const items = allData[key] || [];
  document.getElementById('statusLeft').textContent = `${items.length} ${I18N[lang].items}`;
  document.getElementById('statusRight').textContent = '';
}

// ===== Preload all tabs (background) =====
async function preloadAll() {
  await render();
  // background load other tabs
  const others = TAB_KEYS.filter((k, i) => i !== currentTab);
  for (const k of others) {
    try { await loadTab(k); } catch(e) {}
  }
  renderHighlights();
}

// ===== Init =====
function init() {
  const t = I18N[lang];
  document.getElementById('searchInput').placeholder = t.search;
  document.getElementById('themeBtn').title = t.theme;
  document.getElementById('refreshBtn').title = t.refresh;

  document.getElementById('themeBtn').onclick = () => {
    const isDark = document.body.dataset.theme === 'dark';
    document.body.dataset.theme = isDark ? 'light' : 'dark';
    document.getElementById('themeBtn').textContent = isDark ? '☀' : '☽';
  };
  document.getElementById('langBtn').onclick = () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    const t = I18N[lang];
    document.getElementById('searchInput').placeholder = t.search;
    document.getElementById('langBtn').textContent = t.lang;
    render();
  };
  document.getElementById('refreshBtn').onclick = refreshAll;
  document.getElementById('searchInput').oninput = (e) => {
    searchQuery = e.target.value.trim();
    renderContent();
  };

  // keyboard: / to focus search
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });

  preloadAll();
}
init();
</script>
</body>
</html>
