<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecPulse — QA Security News</title>
<style>
:root {
  --bg: #0f1117;
  --bg2: #161922;
  --bg3: #1c1f2b;
  --border: #2a2d3a;
  --text: #e4e6ed;
  --text2: #8b8fa3;
  --text3: #5c5f72;
  --accent: #4f8cff;
  --accent2: #3a6fd8;
  --red: #ef4444;
  --orange: #f59e0b;
  --yellow: #eab308;
  --green: #22c55e;
  --radius: 8px;
}
[data-theme="light"] {
  --bg: #fafafa;
  --bg2: #ffffff;
  --bg3: #f3f4f6;
  --border: #e2e4e9;
  --text: #1a1c23;
  --text2: #5c5f72;
  --text3: #9ca0b0;
  --accent: #3b6fd4;
  --accent2: #2d5ab8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  height: 52px;
}
.logo {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  white-space: nowrap;
}
.logo span { color: var(--accent); }
.tabs {
  display: flex;
  gap: 2px;
  margin-left: 12px;
  flex: 1;
  min-width: 0;
}
.tab {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.search-wrap { position: relative; }
.search-input {
  width: 180px;
  padding: 6px 10px 6px 28px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
  outline: none;
  transition: border-color .15s, width .2s;
}
.search-input:focus { border-color: var(--accent); width: 220px; }
.search-icon {
  position: absolute;
  left: 8px; top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--text3);
}
.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--text); border-color: var(--text3); }
.icon-btn:disabled { opacity: .45; cursor: wait; }
.icon-btn.spinning { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Main */
.main {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* Highlights */
.highlights {
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  max-height: 140px;
  overflow: hidden;
  flex-shrink: 0;
}
.hl-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text3);
  margin-bottom: 8px;
}
.hl-list { display: flex; flex-direction: column; gap: 4px; }
.hl-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  padding: 4px 10px;
  background: var(--bg2);
  border-radius: 6px;
  border: 1px solid var(--border);
  transition: border-color .15s;
}
.hl-item:hover { border-color: var(--text3); }
.hl-item a { color: var(--text); text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hl-item a:hover { color: var(--accent); }
.hl-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.hl-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.badge-critical { background: rgba(239,68,68,.15); color: var(--red); }
.badge-high { background: rgba(245,158,11,.15); color: var(--orange); }
.badge-medium { background: rgba(234,179,8,.15); color: var(--yellow); }
.badge-low { background: rgba(34,197,94,.15); color: var(--green); }
.badge-info { background: rgba(79,140,255,.15); color: var(--accent); }

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
  scroll-behavior: smooth;
}
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Cards grid */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.news-card {
  padding: 12px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: default;
  transition: border-color .15s;
}
.news-card:hover { border-color: var(--text3); }
.news-card.expanded { grid-column: 1 / -1; }
.nc-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.nc-source {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .3px;
}
.nc-time { font-size: 11px; color: var(--text3); margin-left: auto; }
.nc-title {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.news-card.expanded .nc-title { -webkit-line-clamp: unset; display: block; }
.nc-title a { color: var(--text); text-decoration: none; }
.nc-title a:hover { color: var(--accent); }
.nc-desc {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
  display: none;
}
.news-card.expanded .nc-desc { display: block; }
.cvss-score {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
}
.cvss-critical { background: rgba(239,68,68,.15); color: var(--red); }
.cvss-high { background: rgba(245,158,11,.15); color: var(--orange); }
.cvss-medium { background: rgba(234,179,8,.15); color: var(--yellow); }
.cvss-low { background: rgba(34,197,94,.15); color: var(--green); }
.nc-products {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text2);
}

/* Expand btn */
.expand-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  margin-top: 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.expand-btn:hover { color: var(--text); border-color: var(--text3); }

/* Loading / Empty */
.loading, .empty-state {
  padding: 40px;
  text-align: center;
  color: var(--text3);
  font-size: 13px;
}
.loading-indicator {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.loading-spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
.content.is-refreshing {
  opacity: .55;
  pointer-events: none;
  transition: opacity .15s;
}
.skeleton {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.skel-card {
  height: 60px;
  background: var(--bg3);
  border-radius: var(--radius);
  animation: pulse 1.2s infinite;
}
@keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: .8; } }

/* Status bar */
.status-bar {
  padding: 6px 24px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text3);
  display: flex;
  justify-content: space-between;
  height: 28px;
  align-items: center;
}

/* Mobile */
@media (max-width: 768px) {
  .header {
    flex-wrap: wrap;
    height: auto;
    padding: 10px 12px;
    gap: 8px;
    row-gap: 6px;
  }
  .logo {
    font-size: 14px;
  }
  .header-actions {
    margin-left: auto;
    flex-shrink: 0;
    gap: 6px;
  }
  .tabs {
    order: 3;
    flex: 1 1 100%;
    width: 100%;
    min-width: 0;
    margin-left: 0;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 0;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 6px 10px;
    font-size: 12px;
  }
  .search-input {
    width: 110px;
    min-width: 0;
  }
  .search-input:focus {
    width: 130px;
  }
  .icon-btn {
    width: 30px;
    height: 30px;
    font-size: 13px;
  }
  .main {
    height: calc(100dvh - 96px);
  }
  .highlights {
    padding: 10px 12px;
    max-height: 120px;
  }
  .content {
    padding: 12px;
  }
  .cards-grid {
    grid-template-columns: 1fr;
  }
  .status-bar {
    padding: 6px 12px;
  }
}
</style>
</head>
<body data-theme="dark">

<div class="header">
  <div class="logo">Sec<span>Pulse</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="header-actions">
    <div class="search-wrap">
      <span class="search-icon">&#x2315;</span>
      <input class="search-input" id="searchInput" type="text" placeholder="">
    </div>
    <button class="icon-btn" id="themeBtn" title="">&#9790;</button>
    <button class="icon-btn" id="langBtn" title="">EN</button>
    <button class="icon-btn" id="refreshBtn" title="">&#10227;</button>
  </div>
</div>

<div class="main">
  <div class="highlights" id="highlights">
    <div class="hl-label" id="hlLabel"></div>
    <div class="hl-list" id="hlList"></div>
  </div>
  <div class="content" id="content">
    <div class="loading"><div class="skeleton"><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div></div></div>
  </div>
  <div class="status-bar">
    <span id="statusLeft"></span>
    <span id="statusRight"></span>
  </div>
</div>

<script>
const I18N = {
  zh: {
    search: '\u641c\u5c0b\u6a19\u984c...',
    todayHighlights: '\u4eca\u65e5\u91cd\u9ede',
    loading: '\u8f09\u5165\u4e2d...',
    loadMore: '\u67e5\u770b\u66f4\u591a \u2193',
    showLess: '\u6536\u8d77 \u2191',
    items: '\u689d',
    lastUpdated: '\u66f4\u65b0\u65bc',
    refresh: '\u5237\u65b0',
    theme: '\u5207\u63db\u4e3b\u984c',
    lang: 'EN',
    empty: '\u66ab\u7121\u8cc7\u6599\u3002\u4ee3\u7406\u670d\u52d9\u53ef\u80fd\u66ab\u6642\u4e0d\u7a69\u5b9a\uff0c\u8acb\u6309\u5237\u65b0\u518d\u8a66\u3002',
    refreshing: '\u5237\u65b0\u4e2d...',
    error: '\u8f09\u5165\u5931\u6557\u3002\u8acb\u6aa2\u67e5\u7db2\u7d61\u3002',
    tabs: ['\u8cc7\u5b89\u52d5\u614b','\u79d1\u6280\u524d\u6cbf','Security','Tech & AI','Product Advisories'],
  },
  en: {
    search: 'Search headlines...',
    todayHighlights: "Today's Highlights",
    loading: 'Loading...',
    loadMore: 'Show more \u2193',
    showLess: 'Show less \u2191',
    items: 'items',
    lastUpdated: 'Updated',
    refresh: 'Refresh',
    theme: 'Toggle theme',
    lang: '\u7e41',
    empty: 'No data. Proxy services may be temporarily unavailable — try refresh.',
    refreshing: 'Refreshing...',
    error: 'Failed to load. Check network.',
    tabs: ['Security CN','Tech CN','Security EN','Tech & AI','Product Advisories'],
  }
};

let lang = 'zh';
let currentTab = 0;
let searchQuery = '';
let allData = {};
let expanded = false;
let lastFetchTs = 0;
let isLoading = false;
let loadProgress = 0;
let loadTotal = 5;

const TAB_KEYS = ['cn_sec', 'cn_tech', 'en_sec', 'en_tech', 'cve'];
const SNAPSHOT_KEY = 'secPulse_snapshot';

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = Date.now() - d.getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}

// ===== Data Loading =====
const FEEDS = {
  cn_sec: [
    { name: 'iThome資安', url: 'https://www.ithome.com.tw/rss/security' },
    { name: 'iThome', url: 'https://www.ithome.com.tw/rss/' }
  ],
  cn_tech: [
    { name: 'iThome', url: 'https://www.ithome.com.tw/rss/' },
    { name: 'TechOrange', url: 'https://feeds.feedburner.com/techorange' }
  ],
  en_sec: [
    { name: 'TheHackerNews', url: 'https://feeds.feedburner.com/TheHackersNews' },
    { name: 'BleepingComputer', url: 'https://www.bleepingcomputer.com/feed/' }
  ],
  en_tech: [
    { name: 'TechCrunch', url: 'https://techcrunch.com/feed/' },
    { name: 'TheVerge', url: 'https://www.theverge.com/rss/index.xml' }
  ],
  cve: [
    { name: 'HKCERT', url: 'https://www.hkcert.org/getrss/security-bulletin' }
  ]
};

function finalizeItems(items, source) {
  items.forEach(it => {
    it.description = (it.description || '').replace(/<[^>]*>/g, '').slice(0, 250);
    if (!it.source) it.source = source;
  });
  if (source === 'HKCERT') {
    items.forEach(it => {
      const d = it.description || '';
      let sev = 'medium';
      if (/critical|極高/i.test(d)) sev = 'critical';
      else if (/high risk|高度/i.test(d)) sev = 'high';
      const cves = [...d.matchAll(/CVE-\d{4}-\d+/g)].map(m => m[0]);
      it.severity = sev;
      it.cveIds = [...new Set(cves)].join(', ');
      it.products = it.title.replace('Multiple Vulnerabilities', '').trim();
    });
  }
  return items.slice(0, 15);
}

function parseRss(xml, source) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const items = [];
  doc.querySelectorAll('item').forEach(el => {
    const title = (el.querySelector('title')?.textContent || '').trim();
    const link = (el.querySelector('link')?.textContent || '').trim();
    const pubDate = (el.querySelector('pubDate')?.textContent || '').trim();
    const descRaw = (el.querySelector('description')?.textContent || '').trim();
    if (title) items.push({ title, link, pubDate, description: descRaw, source });
  });
  if (items.length === 0) {
    const ns = 'http://www.w3.org/2005/Atom';
    doc.querySelectorAll('entry').forEach(el => {
      const title = (el.getElementsByTagNameNS(ns, 'title')[0]?.textContent || el.querySelector('title')?.textContent || '').trim();
      const linkEl = el.querySelector('link[rel="alternate"]') || el.querySelector('link');
      const link = (linkEl?.getAttribute('href') || '').trim();
      const pubDate = (el.getElementsByTagNameNS(ns, 'published')[0]?.textContent || el.getElementsByTagNameNS(ns, 'updated')[0]?.textContent || el.querySelector('published,updated')?.textContent || '').trim();
      const descEl = el.getElementsByTagNameNS(ns, 'summary')[0] || el.getElementsByTagNameNS(ns, 'content')[0] || el.querySelector('summary,content');
      const descRaw = (descEl?.textContent || '').trim();
      if (title) items.push({ title, link, pubDate, description: descRaw, source });
    });
  }
  return finalizeItems(items, source);
}

const NEWS_CACHE_TTL = 10 * 60 * 1000;
function newsCacheKey(feed) { return 'secPulse_' + feed.url; }
function getNewsCache(feed, allowStale = false) {
  try {
    const raw = localStorage.getItem(newsCacheKey(feed));
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (allowStale || Date.now() - obj.ts < NEWS_CACHE_TTL) return obj.items;
  } catch {}
  return null;
}
function setNewsCache(feed, items) {
  try { localStorage.setItem(newsCacheKey(feed), JSON.stringify({ ts: Date.now(), items })); } catch {}
}
function hasAnyData(data = allData) {
  return TAB_KEYS.some(k => (data[k] || []).length > 0);
}
function cloneTabs(tabs) {
  const out = {};
  TAB_KEYS.forEach(k => { out[k] = (tabs[k] || []).map(it => ({ ...it })); });
  return out;
}
function saveSnapshot() {
  if (!hasAnyData()) return;
  try {
    localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({ ts: Date.now(), tabs: allData, lastFetchTs }));
  } catch {}
}
function restoreSnapshot() {
  try {
    const raw = localStorage.getItem(SNAPSHOT_KEY);
    if (!raw) return false;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.ts > NEWS_CACHE_TTL || !obj.tabs) return false;
    allData = obj.tabs;
    lastFetchTs = obj.lastFetchTs || '';
    return hasAnyData();
  } catch { return false; }
}
function showContentSkeleton() {
  document.getElementById('content').innerHTML =
    '<div class="loading"><div class="loading-indicator"><span class="loading-spinner"></span><span>' +
    esc(I18N[lang].loading) + '</span></div></div>';
  document.getElementById('hlList').innerHTML =
    '<div style="font-size:12px;color:var(--text3);padding:8px">' + esc(I18N[lang].loading) + '</div>';
}
function setLoadingUI(active, refreshing = false) {
  isLoading = active;
  const btn = document.getElementById('refreshBtn');
  const content = document.getElementById('content');
  btn.disabled = active;
  btn.classList.toggle('spinning', active);
  content.classList.toggle('is-refreshing', active && refreshing && hasAnyData());
  const statusRight = document.getElementById('statusRight');
  if (!active) {
    statusRight.textContent = '';
    return;
  }
  const label = refreshing ? I18N[lang].refreshing : I18N[lang].loading;
  statusRight.textContent = loadProgress > 0
    ? label + ' ' + loadProgress + '/' + loadTotal
    : label;
}
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
  ]);
}
async function tryProxy(fn) {
  const res = await fn();
  if (res && res.length) return res;
  throw new Error('empty');
}

async function fetchFeed(feed, skipCache = false) {
  if (!skipCache) {
    const cached = getNewsCache(feed);
    if (cached) return cached;
  }
  const proxies = [
    () => fetch('https://corsproxy.io/?url=' + encodeURIComponent(feed.url))
      .then(r => { if (!r.ok) throw new Error('http'); return r.text(); })
      .then(xml => {
        if (!xml || !/<rss|<feed|<item|<entry/i.test(xml)) return null;
        return parseRss(xml, feed.name);
      }),
    () => fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(feed.url))
      .then(r => { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(data => {
        const xml = data && data.contents;
        if (!xml || !/<rss|<feed|<item|<entry/i.test(xml)) return null;
        return parseRss(xml, feed.name);
      }),
    () => fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(feed.url))
      .then(r => { if (!r.ok) throw new Error('http'); return r.text(); })
      .then(xml => {
        if (!xml || !/<rss|<feed|<item|<entry/i.test(xml)) return null;
        return parseRss(xml, feed.name);
      }),
    () => fetch('https://api.rss2json.com/v1/api.json?count=15&rss_url=' + encodeURIComponent(feed.url))
      .then(r => r.json()).then(data => {
        if (data && data.status === 'ok' && Array.isArray(data.items) && data.items.length) {
          return finalizeItems(data.items.slice(0, 15).map(it => ({
            title: it.title || '',
            link: it.link || '',
            pubDate: it.pubDate || '',
            description: it.description || '',
            source: feed.name
          })), feed.name);
        }
        return null;
      })
  ];
  try {
    const winner = await Promise.any(proxies.map(p => withTimeout(tryProxy(p), 6000)));
    if (winner && winner.length) {
      setNewsCache(feed, winner);
      return winner;
    }
  } catch {}
  return getNewsCache(feed, true) || [];
}

function processTabs(tabs) {
  const next = cloneTabs(tabs);
  for (const key of TAB_KEYS) {
    const seen = new Set();
    next[key] = (next[key] || [])
      .sort((a, b) => (b.pubDate || '').localeCompare(a.pubDate || ''))
      .filter(it => {
        const k = (it.title || '').trim().toLowerCase();
        if (!k || seen.has(k)) return false;
        seen.add(k);
        return true;
      })
      .slice(0, 20);
  }
  const cnSecTitles = new Set(next.cn_sec.map(it => (it.title || '').trim().toLowerCase()));
  next.cn_tech = next.cn_tech.filter(it => !cnSecTitles.has((it.title || '').trim().toLowerCase()));
  return next;
}

async function loadData({ skipCache = false, onProgress = null } = {}) {
  const tabs = { cn_sec: [], cn_tech: [], en_sec: [], en_tech: [], cve: [] };
  const backup = cloneTabs(allData);
  const backupTs = lastFetchTs;
  loadTotal = TAB_KEYS.length;
  loadProgress = 0;

  await Promise.all(TAB_KEYS.map(async key => {
    const results = await Promise.allSettled(FEEDS[key].map(f => fetchFeed(f, skipCache)));
    results.forEach(r => { if (r.status === 'fulfilled') tabs[key].push(...r.value); });
    loadProgress += 1;
    if (onProgress) {
      allData = processTabs(tabs);
      onProgress();
    }
  }));

  const processed = processTabs(tabs);
  if (hasAnyData(processed)) {
    allData = processed;
    lastFetchTs = new Date().toISOString();
    saveSnapshot();
  } else if (hasAnyData(backup)) {
    allData = backup;
    lastFetchTs = backupTs;
  } else {
    allData = processed;
    lastFetchTs = new Date().toISOString();
  }
}

async function refreshAll() {
  if (isLoading) return;
  setLoadingUI(true, true);
  try {
    await loadData({ skipCache: true, onProgress: () => { setLoadingUI(true, true); render(); } });
  } finally {
    setLoadingUI(false);
    render();
  }
}

// ===== Render =====
function render() {
  renderTabs();
  renderHighlights();
  renderContent();
  renderStatus();
}

function renderContent() {
  const key = TAB_KEYS[currentTab];
  const content = document.getElementById('content');
  if (isLoading && !hasAnyData()) {
    showContentSkeleton();
    return;
  }
  let items = allData[key] || [];
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    items = items.filter(it => (it.title || '').toLowerCase().includes(q));
  }
  if (items.length === 0) {
    content.innerHTML = '<div class="empty-state">' + I18N[lang].empty + '</div>';
    return;
  }
  const showCount = expanded ? items.length : Math.min(8, items.length);
  const visible = items.slice(0, showCount);
  const isCve = key === 'cve';
  let html = '<div class="cards-grid">';
  visible.forEach(item => {
    const safeLink = /^https?:\/\//i.test(String(item.link || '').trim());
    if (isCve) {
      const cls = (item.severity || 'medium').toLowerCase();
      const riskZh = cls === 'critical' ? '\u6975\u9ad8\u98a8\u96aa' : cls === 'high' ? '\u9ad8\u5ea6\u98a8\u96aa' : cls === 'medium' ? '\u4e2d\u5ea6\u98a8\u96aa' : '\u4f4e\u5ea6\u98a8\u96aa';
      const riskEn = cls === 'critical' ? 'Critical' : cls === 'high' ? 'High Risk' : cls === 'medium' ? 'Medium Risk' : 'Low Risk';
      const badgeCls = cls === 'critical' ? 'cvss-critical' : cls === 'high' ? 'cvss-high' : cls === 'medium' ? 'cvss-medium' : 'cvss-low';
      const dateStr = item.pubDate ? new Date(item.pubDate).toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric'}) : '';
      const metaParts = [];
      if (item.cveIds) metaParts.push(item.cveIds);
      if (item.products) metaParts.push(item.products);
      html += '<div class="news-card' + (expanded ? ' expanded' : '') + '" data-link="' + esc(item.link) + '">' +
        '<div class="nc-top">' +
        '<span class="cvss-score ' + badgeCls + '">' + riskZh + ' ' + riskEn + '</span>' +
        '<span class="nc-time">' + dateStr + '</span>' +
        '</div>' +
        '<div class="nc-title"><a href="' + (safeLink ? esc(item.link) : '#') + '" target="_blank" rel="noopener">' + esc(item.title) + '</a></div>' +
        '<div class="nc-desc">' + esc(item.description || '') + '</div>' +
        '<div class="nc-products">' + esc(metaParts.join(' | ')) + '</div>' +
        '</div>';
    } else {
      html += '<div class="news-card' + (expanded ? ' expanded' : '') + '" data-link="' + esc(item.link) + '">' +
        '<div class="nc-top">' +
        '<span class="nc-source">' + esc(item.source) + '</span>' +
        '<span class="nc-time">' + timeAgo(item.pubDate) + '</span>' +
        '</div>' +
        '<div class="nc-title"><a href="' + (safeLink ? esc(item.link) : '#') + '" target="_blank" rel="noopener">' + esc(item.title) + '</a></div>' +
        '<div class="nc-desc">' + esc((item.description || '').slice(0, 200)) + '</div>' +
        '</div>';
    }
  });
  html += '</div>';
  if (items.length > 8) {
    html += '<div class="expand-btn" id="expandBtn">' + (expanded ? I18N[lang].showLess : I18N[lang].loadMore) + '</div>';
  }
  content.innerHTML = html;
  const expandBtn = document.getElementById('expandBtn');
  if (expandBtn) {
    expandBtn.onclick = () => { expanded = !expanded; renderContent(); };
  }
}

function renderHighlights() {
  const hlList = document.getElementById('hlList');
  document.getElementById('hlLabel').textContent = I18N[lang].todayHighlights;
  if (isLoading && !hasAnyData()) {
    hlList.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:8px">' + esc(I18N[lang].loading) + '</div>';
    return;
  }
  const items = [];
  // CVE/advisories first
  (allData.cve || []).slice(0, 3).forEach(c => {
    const cls = (c.severity || 'medium').toLowerCase();
    const dotColor = cls === 'critical' ? 'var(--red)' : cls === 'high' ? 'var(--orange)' : 'var(--yellow)';
    const badgeCls = cls === 'critical' ? 'badge-critical' : cls === 'high' ? 'badge-high' : 'badge-medium';
    const riskShort = cls === 'critical' ? '\u6975\u9ad8' : cls === 'high' ? 'High' : 'Med';
    items.push({ dot: dotColor, badge: '<span class="hl-badge ' + badgeCls + '">' + riskShort + '</span>', title: c.title, link: c.link });
  });
  // Top from other tabs
  TAB_KEYS.forEach(k => {
    if (items.length >= 5) return;
    (allData[k] || []).slice(0, 2).forEach(it => {
      if (items.length < 5 && !items.find(x => x.title === it.title)) {
        items.push({ dot: 'var(--accent)', badge: '', title: it.title, link: it.link });
      }
    });
  });
  if (items.length === 0) {
    hlList.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:8px">' +
      esc(isLoading ? I18N[lang].loading : I18N[lang].empty) + '</div>';
    return;
  }
  hlList.innerHTML = items.slice(0, 5).map(it =>
    '<div class="hl-item">' +
    '<span class="hl-dot" style="background:' + it.dot + '"></span>' +
    '<a href="' + (/^https?:\/\//i.test(it.link||'') ? esc(it.link) : '#') + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>' +
    it.badge +
    '</div>'
  ).join('');
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = I18N[lang].tabs.map((t, i) =>
    '<div class="tab' + (i === currentTab ? ' active' : '') + '" data-i="' + i + '">' + t + '</div>'
  ).join('');
  tabs.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { currentTab = +el.dataset.i; expanded = false; render(); };
  });
}

function renderStatus() {
  const key = TAB_KEYS[currentTab];
  const items = allData[key] || [];
  let left = items.length + ' ' + I18N[lang].items;
  if (lastFetchTs) left += '  \u00b7  ' + I18N[lang].lastUpdated + ' ' + timeAgo(lastFetchTs);
  document.getElementById('statusLeft').textContent = left;
  if (!isLoading) {
    document.getElementById('statusRight').textContent = '';
  }
}

// ===== Init =====
function init() {
  const t = I18N[lang];
  document.getElementById('searchInput').placeholder = t.search;
  document.getElementById('themeBtn').title = t.theme;
  document.getElementById('refreshBtn').title = t.refresh;

  document.getElementById('themeBtn').onclick = () => {
    const isDark = document.body.dataset.theme === 'dark';
    document.body.dataset.theme = isDark ? 'light' : 'dark';
    document.getElementById('themeBtn').textContent = isDark ? '\u2600' : '\u263d';
  };
  document.getElementById('langBtn').onclick = () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    const t = I18N[lang];
    document.getElementById('searchInput').placeholder = t.search;
    document.getElementById('langBtn').textContent = t.lang;
    render();
  };
  document.getElementById('refreshBtn').onclick = refreshAll;
  document.getElementById('searchInput').oninput = (e) => {
    searchQuery = e.target.value.trim();
    renderContent();
  };

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });

  // Bootstrap: snapshot first for instant paint, then fetch fresh
  render();
  const hasSnapshot = restoreSnapshot();
  if (hasSnapshot) render();
  else showContentSkeleton();

  setLoadingUI(true, false);
  loadData({ onProgress: () => { setLoadingUI(true, false); render(); } })
    .then(() => { setLoadingUI(false); render(); })
    .catch(() => { setLoadingUI(false); render(); });
}
init();
</script>
</body>
</html>
