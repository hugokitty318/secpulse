name: Fetch News Feeds

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch: {}      # manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all feeds
        run: |
          mkdir -p /tmp/feeds
          rm -f /tmp/feeds/*.json

          fetch_feed() {
            local SOURCE="$1"
            local URL="$2"
            local OUTFILE="$3"
            echo "Fetching: $SOURCE"
            local XML
            XML=$(curl -sL --max-time 15 -H "User-Agent: Mozilla/5.0" -H "Accept: application/rss+xml, application/xml, text/xml" "$URL" 2>/dev/null) || XML=""
            if [ -z "$XML" ] || ! echo "$XML" | grep -q "<rss\|<feed\|<item\|<entry"; then
              echo "  -> Failed, writing empty"
              echo "[]" > "$OUTFILE"
              return
            fi
            echo "$XML" | python3 -c "
          import sys, xml.etree.ElementTree as ET, json, re, html
          source = '''$SOURCE'''
          items = []
          data = sys.stdin.read()
          try:
              root = ET.fromstring(data)
          except ET.ParseError:
              print(json.dumps([]))
              sys.exit(0)
          for item in root.iter('item'):
              title = (item.findtext('title') or '').strip()
              link = (item.findtext('link') or '').strip()
              pubDate = (item.findtext('pubDate') or '').strip()
              desc_raw = (item.findtext('description') or '').strip()
              desc = html.unescape(re.sub(r'<[^>]*>', '', desc_raw)).strip()[:250]
              if title:
                  items.append({'title': title, 'link': link, 'pubDate': pubDate, 'description': desc, 'source': source})
          if not items:
              ns = {'a': 'http://www.w3.org/2005/Atom'}
              for entry in root.findall('.//a:entry', ns):
                  title = (entry.findtext('a:title', namespaces=ns) or '').strip()
                  link_el = entry.find(\"a:link[@rel='alternate']\", ns) or entry.find('a:link', ns)
                  link = (link_el.get('href') or '').strip() if link_el is not None else ''
                  pubDate = (entry.findtext('a:published', namespaces=ns) or entry.findtext('a:updated', namespaces=ns) or '').strip()
                  desc_raw = (entry.findtext('a:summary', namespaces=ns) or entry.findtext('a:content', namespaces=ns) or '').strip()
                  desc = html.unescape(re.sub(r'<[^>]*>', '', desc_raw)).strip()[:250]
                  if title:
                      items.append({'title': title, 'link': link, 'pubDate': pubDate, 'description': desc, 'source': source})
          if source == 'HKCERT':
              for it in items:
                  d = it.get('description','')
                  sev = 'MEDIUM'
                  if re.search(r'critical|極高', d, re.I): sev = 'CRITICAL'
                  elif re.search(r'high risk|高度', d, re.I): sev = 'HIGH'
                  cves = re.findall(r'CVE-\d{4}-\d+', d)
                  it['severity'] = sev
                  it['cveIds'] = ', '.join(list(dict.fromkeys(cves)))
                  it['products'] = it['title'].replace('Multiple Vulnerabilities','').strip()
          print(json.dumps(items[:15]))
          " 2>/dev/null > "$OUTFILE" || echo "[]" > "$OUTFILE"
            echo "  -> Saved to $OUTFILE"
          }

          fetch_feed "iThome資安" "https://www.ithome.com.tw/rss/security" "/tmp/feeds/cn_sec_1.json"
          fetch_feed "iThome" "https://www.ithome.com.tw/rss/" "/tmp/feeds/cn_sec_2.json"
          fetch_feed "iThome" "https://www.ithome.com.tw/rss/" "/tmp/feeds/cn_tech_1.json"
          fetch_feed "INSIDE" "https://www.inside.com.tw/feed/" "/tmp/feeds/cn_tech_2.json"
          fetch_feed "TechOrange" "https://feeds.feedburner.com/techorange" "/tmp/feeds/cn_tech_3.json"
          fetch_feed "TheHackerNews" "https://feeds.feedburner.com/TheHackersNews" "/tmp/feeds/en_sec_1.json"
          fetch_feed "BleepingComputer" "https://www.bleepingcomputer.com/feed/" "/tmp/feeds/en_sec_2.json"
          fetch_feed "TechCrunch" "https://techcrunch.com/feed/" "/tmp/feeds/en_tech_1.json"
          fetch_feed "TheVerge" "https://www.theverge.com/rss/index.xml" "/tmp/feeds/en_tech_2.json"
          fetch_feed "HKCERT" "https://www.hkcert.org/getrss/security-bulletin" "/tmp/feeds/cve_1.json"

          echo "All feeds fetched."

      - name: Merge and write data.json
        run: |
          python3 << 'PYEOF'
          import json, glob
          from datetime import datetime, timezone

          tabs = {'cn_sec': [], 'cn_tech': [], 'en_sec': [], 'en_tech': [], 'cve': []}
          for f in glob.glob('/tmp/feeds/*.json'):
              tab = f.split('/')[-1].rsplit('_', 1)[0]
              try:
                  with open(f) as fh:
                      items = json.load(fh)
                  if isinstance(items, list):
                      tabs[tab].extend(items)
              except:
                  pass

          for tab in tabs:
              seen = set()
              unique = []
              for it in sorted(tabs[tab], key=lambda x: x.get('pubDate',''), reverse=True):
                  key = (it.get('title','') or '').strip().lower()
                  if not key or key in seen:
                      continue
                  seen.add(key)
                  unique.append(it)
              tabs[tab] = unique[:20]

          cn_sec_titles = set(it.get('title','').strip().lower() for it in tabs['cn_sec'])
          tabs['cn_tech'] = [it for it in tabs['cn_tech'] if it.get('title','').strip().lower() not in cn_sec_titles]

          data = {'ts': datetime.now(timezone.utc).isoformat(), 'tabs': tabs}
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          total = sum(len(v) for v in tabs.values())
          print(f"Wrote data.json: {total} items")
          PYEOF

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update feeds $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          fi
